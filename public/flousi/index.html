<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فلوسي — مداخيلي ومصاريفي</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#17201e; --muted:#66736f; --line:#e3e8e6;
  --brand:#0f766e; --brand-soft:#e0f2ef;
  --in:#15803d; --in-soft:#dcfce7; --out:#c2410c; --out-soft:#ffedd5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1514; --card:#18211f; --ink:#e8efed; --muted:#93a29e; --line:#26322f;
    --brand:#2dd4bf; --brand-soft:#123a35;
    --in:#4ade80; --in-soft:#14301f; --out:#fb923c; --out-soft:#3a2312;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header.top h1{font-size:20px;margin:0;font-weight:700}
header.top h1 span{color:var(--brand)}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;font-size:18px}

/* period */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.seg button.on{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#06201d}}
.nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.nav .label{font-weight:600;text-align:center;flex:1}
.nav .label small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.custom{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.custom[hidden]{display:none}
.custom label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);flex:1;min-width:130px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.kpi.in .v{color:var(--in)} .kpi.out .v{color:var(--out)}
.kpi .d{font-size:11px;color:var(--muted)}
@media (max-width:420px){.kpi .v{font-size:16px}.kpi{padding:10px}}

.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .tabs{display:flex;gap:4px}
.pill{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.pill.on{background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}

/* chart */
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;gap:1px;align-items:flex-end;height:100%;min-width:0;cursor:default;position:relative}
.chart .b{flex:1;border-radius:3px 3px 0 0;min-height:0}
.chart .b.i{background:var(--in)} .chart .b.o{background:var(--out)}
.chart .col:hover .b{opacity:.75}
.axis{display:flex;gap:3px;font-size:10px;color:var(--muted);margin-top:4px}
.axis span{flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:visible;width:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.tip{position:fixed;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;z-index:50;white-space:nowrap}

/* breakdown */
.cat-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-radius:10px;cursor:pointer}
.cat-row:hover{background:var(--bg)}
.cat-row.sel{background:var(--brand-soft)}
.cat-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.cat-name{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.cat-name small{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.cat-amt{font-weight:600;font-size:14px;direction:ltr}

/* list */
.day-h{font-size:12px;color:var(--muted);margin:12px 0 4px;display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .cat-ico{width:36px;height:36px}
.tx .t1{font-size:14px;font-weight:500}
.tx .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;direction:ltr;white-space:nowrap}
.tx .amt.i{color:var(--in)} .tx .amt.o{color:var(--out)}
.filter-note{font-size:12px;background:var(--brand-soft);color:var(--brand);padding:6px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.filter-note button{border:0;background:none;color:inherit;cursor:pointer;font-weight:600}

/* fab */
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
.fab button{border:0;border-radius:999px;padding:13px 20px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:15px;white-space:nowrap}
.fab .fi{background:var(--in)} .fab .fo{background:var(--out)}
@media (prefers-color-scheme:dark){.fab button{color:#111}}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100% - 24px));background:var(--card);color:var(--ink);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px}
.dlg h3{margin:0 0 12px;font-size:17px}
.field{margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.amount-in{font-size:26px;font-weight:700;text-align:center;direction:ltr}
.type-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.type-seg button{border:1px solid var(--line);background:none;padding:9px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.type-seg button.on.i{background:var(--in-soft);color:var(--in);border-color:var(--in)}
.type-seg button.on.o{background:var(--out-soft);color:var(--out);border-color:var(--out)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (prefers-color-scheme:dark){.chip.on{color:#06201d}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#06201d}}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:none;color:#dc2626;border:1px solid #fca5a5}
.btn:disabled{opacity:.5}
.err{color:#dc2626;font-size:13px;margin:6px 0 0}
.set-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.set-sec h4{margin:0 0 8px;font-size:14px}
.cat-edit{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.cat-edit span{flex:1}
.cat-edit button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.add-cat{display:grid;grid-template-columns:64px 1fr auto;gap:6px;margin-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>💰 <span>فلوسي</span></h1>
    <button class="icon-btn" id="btn-settings" aria-label="الإعدادات">⚙️</button>
  </header>

  <div class="seg" id="modes">
    <button data-m="day">يوم</button>
    <button data-m="week">أسبوع</button>
    <button data-m="month" class="on">شهر</button>
    <button data-m="year">سنة</button>
    <button data-m="custom">مدة</button>
  </div>

  <div class="nav" id="nav">
    <button class="icon-btn" id="prev" aria-label="الفترة السابقة">›</button>
    <div class="label" id="plabel"></div>
    <button class="icon-btn" id="next" aria-label="الفترة الموالية">‹</button>
  </div>
  <div class="custom" id="custom" hidden>
    <label>من<input type="date" id="cfrom"></label>
    <label>إلى<input type="date" id="cto"></label>
  </div>

  <div class="kpis">
    <div class="kpi in"><div class="k">المداخيل</div><div class="v" id="k-in">0</div><div class="d" id="k-in-d"></div></div>
    <div class="kpi out"><div class="k">المصاريف</div><div class="v" id="k-out">0</div><div class="d" id="k-out-d"></div></div>
    <div class="kpi"><div class="k">الباقي</div><div class="v" id="k-net">0</div><div class="d" id="k-net-d"></div></div>
  </div>

  <section class="card" id="chart-card">
    <h2><span id="chart-title">حسب الأيام</span></h2>
    <div class="chart" id="chart"></div>
    <div class="axis" id="axis"></div>
    <div class="legend"><span><i style="background:var(--in)"></i>مداخيل</span><span><i style="background:var(--out)"></i>مصاريف</span></div>
  </section>

  <section class="card">
    <h2><span>حسب النوع</span>
      <span class="tabs"><button class="pill on" data-bt="expense">المصاريف</button><button class="pill" data-bt="income">المداخيل</button></span>
    </h2>
    <div id="breakdown"></div>
  </section>

  <section class="card">
    <h2><span>العمليات</span><span class="note" id="tx-count"></span></h2>
    <div id="list"></div>
  </section>
</div>

<div class="fab">
  <button class="fo" id="add-out">− مصروف</button>
  <button class="fi" id="add-in">+ مدخول</button>
</div>

<dialog id="dlg-tx">
  <form class="dlg" id="form-tx" method="dialog" novalidate>
    <h3 id="tx-title">عملية جديدة</h3>
    <div class="type-seg">
      <button type="button" data-t="expense" class="o">مصروف</button>
      <button type="button" data-t="income" class="i">مدخول</button>
    </div>
    <div class="field"><span>المبلغ (<b class="cur"></b>)</span>
      <input class="amount-in" id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0">
    </div>
    <div class="field"><span>النوع</span><div class="chips" id="f-cats"></div></div>
    <div class="row2">
      <div class="field"><span>التاريخ</span><input type="date" id="f-date"></div>
      <div class="field"><span>ملاحظة (اختياري)</span><input id="f-note" maxlength="120" placeholder="مثلاً: قضية الجمعة"></div>
    </div>
    <p class="err" id="f-err" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="f-del" hidden>حذف</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="f-cancel">إلغاء</button>
      <button type="submit" class="btn" id="f-save">حفظ</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-set">
  <div class="dlg">
    <h3>الإعدادات</h3>
    <div class="field"><span>العملة</span><input id="s-cur" maxlength="8"></div>

    <div class="set-sec">
      <h4>أنواع المصاريف</h4>
      <div id="s-cats-expense"></div>
      <div class="add-cat"><input id="s-ico-expense" placeholder="🙂" maxlength="4"><input id="s-name-expense" placeholder="نوع جديد"><button class="btn" data-addcat="expense">إضافة</button></div>
    </div>
    <div class="set-sec">
      <h4>أنواع المداخيل</h4>
      <div id="s-cats-income"></div>
      <div class="add-cat"><input id="s-ico-income" placeholder="🙂" maxlength="4"><input id="s-name-income" placeholder="نوع جديد"><button class="btn" data-addcat="income">إضافة</button></div>
    </div>

    <div class="set-sec">
      <h4>المعطيات</h4>
      <p class="note">المعطيات محفوظة في هذا الجهاز فقط. احفظ نسخة من حين لآخر.</p>
      <div class="btns">
        <button class="btn ghost" id="s-export">⬇️ حفظ نسخة (JSON)</button>
        <button class="btn ghost" id="s-import">⬆️ استرجاع نسخة</button>
        <button class="btn ghost" id="s-csv">📄 تصدير Excel (CSV)</button>
        <button class="btn danger" id="s-wipe">مسح كل شيء</button>
      </div>
      <input type="file" id="s-file" accept="application/json,.json" hidden>
    </div>
    <div class="actions"><span></span><button class="btn" id="s-close">تمّ</button></div>
  </div>
</dialog>

<script>
'use strict';
const KEY = 'flousi.v1';
const COLORS = ['#0f766e','#c2410c','#7c3aed','#2563eb','#db2777','#ca8a04','#059669','#dc2626','#0891b2','#9333ea','#65a30d','#64748b'];
const DEFAULT = {
  currency: 'د.ت',
  cats: {
    expense: [
      ['food','أكل ومشتريات','🛒'],['transport','نقل وبنزين','🚗'],['home','سكن وكراء','🏠'],
      ['bills','فواتير','💡'],['health','صحة','💊'],['edu','تعليم','📚'],['clothes','ملابس','👕'],
      ['family','عائلة وأولاد','👨‍👩‍👧'],['fun','خرجات وترفيه','☕'],['phone','هاتف وأنترنت','📱'],
      ['debt','ديون وأقساط','💳'],['other_e','أخرى','📦'],
    ],
    income: [
      ['salary','أجرة','💼'],['business','مشروع / تجارة','🏪'],['extra','عمل إضافي','🛠️'],
      ['gift','هدية / منحة','🎁'],['debt_in','استرجاع دين','🤝'],['other_i','أخرى','💰'],
    ],
  },
};

/* ---------- storage ---------- */
function freshState(){
  const c = t => DEFAULT.cats[t].map(([id,name,icon],i)=>({id,name,icon,color:COLORS[i%COLORS.length]}));
  return { currency: DEFAULT.currency, cats:{expense:c('expense'), income:c('income')}, tx:[] };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.tx) && s.cats) return s;
  }catch(e){}
  return freshState();
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('تعذّر الحفظ في هذا المتصفح'); }
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAYS_SHORT = ['أح','اث','ثل','أر','خم','جم','سب'];
const fmtDay = d => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtShort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const startOfWeek = d => addDays(d, -((d.getDay()+6)%7)); // الأسبوع يبدأ يوم الاثنين

/* ---------- money ---------- */
const nf = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:3});
const money = n => nf.format(Math.round(n*1000)/1000);
const moneyC = n => `${money(n)} ${S.currency}`;
function parseAmount(s){
  s = String(s).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\s/g,'').replace(',', '.');
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}

/* ---------- period ---------- */
const P = { mode:'month', anchor:new Date(), from:null, to:null };
function range(mode = P.mode, a = P.anchor){
  const d = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  if (mode === 'day') return [d, d];
  if (mode === 'week'){ const s = startOfWeek(d); return [s, addDays(s,6)]; }
  if (mode === 'month') return [new Date(d.getFullYear(), d.getMonth(), 1), new Date(d.getFullYear(), d.getMonth()+1, 0)];
  if (mode === 'year') return [new Date(d.getFullYear(),0,1), new Date(d.getFullYear(),11,31)];
  let f = P.from ? parse(P.from) : addDays(d,-29), t = P.to ? parse(P.to) : d;
  if (f > t) [f,t] = [t,f];
  return [f, t];
}
function shift(dir){
  const a = P.anchor;
  if (P.mode === 'day') P.anchor = addDays(a, dir);
  else if (P.mode === 'week') P.anchor = addDays(a, 7*dir);
  else if (P.mode === 'month') P.anchor = new Date(a.getFullYear(), a.getMonth()+dir, 1);
  else if (P.mode === 'year') P.anchor = new Date(a.getFullYear()+dir, 0, 1);
  render();
}
function prevRange(){
  if (P.mode !== 'custom'){
    const a = P.anchor;
    const b = P.mode==='day' ? addDays(a,-1) : P.mode==='week' ? addDays(a,-7)
      : P.mode==='month' ? new Date(a.getFullYear(), a.getMonth()-1, 1) : new Date(a.getFullYear()-1,0,1);
    return range(P.mode, b);
  }
  const [f,t] = range(); const len = Math.round((t-f)/864e5)+1;
  return [addDays(f,-len), addDays(f,-1)];
}
function label(){
  const [f,t] = range(), today = new Date();
  if (P.mode === 'day'){
    const diff = Math.round((parse(ymd(today)) - f)/864e5);
    const rel = diff===0 ? 'اليوم' : diff===1 ? 'البارحة' : '';
    return `${rel || DAYS[f.getDay()]}<small>${fmtDay(f)}</small>`;
  }
  if (P.mode === 'week') return `${fmtShort(f)} ← ${fmtShort(t)}<small>${t.getFullYear()}</small>`;
  if (P.mode === 'month') return `${MONTHS[f.getMonth()]} ${f.getFullYear()}`;
  if (P.mode === 'year') return `${f.getFullYear()}`;
  return `${fmtShort(f)} ${f.getFullYear()} ← ${fmtShort(t)} ${t.getFullYear()}<small>${Math.round((t-f)/864e5)+1} يوم</small>`;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catOf = (type,id) => S.cats[type].find(c=>c.id===id) || {id, name:'محذوف', icon:'❔', color:'#94a3b8'};
const inRange = ([f,t]) => { const a = ymd(f), b = ymd(t); return S.tx.filter(x => x.date >= a && x.date <= b); };
const sum = (arr,type) => arr.reduce((s,x)=> x.type===type ? s + x.amount : s, 0);
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2200);
}
function delta(cur, prev, goodWhenUp){
  if (!prev && !cur) return '';
  if (!prev) return 'لا شيء في الفترة السابقة';
  const p = Math.round((cur-prev)/prev*100);
  if (p === 0) return 'مثل الفترة السابقة';
  const up = p > 0, good = up === goodWhenUp;
  return `<span style="color:${good?'var(--in)':'var(--out)'}">${up?'▲':'▼'} ${Math.abs(p)}%</span> مقارنة بالسابقة`;
}

/* ---------- render ---------- */
let breakType = 'expense', catFilter = null;
function render(){
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on', b.dataset.m===P.mode));
  const custom = P.mode === 'custom';
  $('#custom').hidden = !custom;
  $('#prev').style.visibility = $('#next').style.visibility = custom ? 'hidden' : 'visible';
  const r = range();
  if (custom){ $('#cfrom').value = ymd(r[0]); $('#cto').value = ymd(r[1]); }
  $('#plabel').innerHTML = label();

  const txs = inRange(r), prev = inRange(prevRange());
  const inc = sum(txs,'income'), out = sum(txs,'expense');
  const pin = sum(prev,'income'), pout = sum(prev,'expense');
  $('#k-in').textContent = money(inc);
  $('#k-out').textContent = money(out);
  $('#k-net').textContent = money(inc-out);
  $('#k-net').style.color = inc-out < 0 ? 'var(--out)' : inc-out > 0 ? 'var(--in)' : '';
  $('#k-in-d').innerHTML = delta(inc, pin, true);
  $('#k-out-d').innerHTML = delta(out, pout, false);
  const days = Math.round((r[1]-r[0])/864e5)+1;
  $('#k-net-d').textContent = days > 1 && out ? `معدّل المصروف: ${money(out/days)} في اليوم` : S.currency;

  renderChart(r, txs, days);
  renderBreakdown(txs);
  renderList(txs);
}

function renderChart([f,t], txs, days){
  const card = $('#chart-card');
  if (days === 1){ card.hidden = true; return; }
  card.hidden = false;
  const byMonth = days > 62;
  const buckets = [];
  if (byMonth){
    for (let d = new Date(f.getFullYear(), f.getMonth(), 1); d <= t; d = new Date(d.getFullYear(), d.getMonth()+1, 1))
      buckets.push({key: `${d.getFullYear()}-${pad(d.getMonth()+1)}`, lab: MONTHS[d.getMonth()].slice(0,3), tip: `${MONTHS[d.getMonth()]} ${d.getFullYear()}`, i:0, o:0});
  } else {
    for (let d = f; d <= t; d = addDays(d,1))
      buckets.push({key: ymd(d), lab: days <= 7 ? DAYS_SHORT[d.getDay()] : String(d.getDate()), tip: fmtDay(d), i:0, o:0});
  }
  const idx = Object.fromEntries(buckets.map((b,i)=>[b.key,i]));
  for (const x of txs){
    const b = buckets[idx[byMonth ? x.date.slice(0,7) : x.date]];
    if (b) b[x.type==='income'?'i':'o'] += x.amount;
  }
  const max = Math.max(1, ...buckets.map(b=>Math.max(b.i,b.o)));
  $('#chart-title').textContent = byMonth ? 'حسب الأشهر' : 'حسب الأيام';
  $('#chart').innerHTML = buckets.map((b,i)=>
    `<div class="col" data-i="${i}"><div class="b i" style="height:${b.i/max*100}%"></div><div class="b o" style="height:${b.o/max*100}%"></div></div>`).join('');
  const step = buckets.length > 16 ? Math.ceil(buckets.length/10) : 1;
  $('#axis').innerHTML = buckets.map((b,i)=>`<span>${i%step===0?b.lab:''}</span>`).join('');
  $('#chart').onmousemove = e => {
    const col = e.target.closest('.col'); let tip = $('.tip');
    if (!col){ tip && tip.remove(); return; }
    const b = buckets[col.dataset.i];
    if (!tip){ tip = document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); }
    tip.innerHTML = `${b.tip}<br>مداخيل: ${moneyC(b.i)}<br>مصاريف: ${moneyC(b.o)}`;
    tip.style.top = (e.clientY - 70) + 'px';
    tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, e.clientX - tip.offsetWidth/2)) + 'px';
  };
  $('#chart').onmouseleave = () => { const tip = $('.tip'); tip && tip.remove(); };
}

function renderBreakdown(txs){
  document.querySelectorAll('[data-bt]').forEach(b=>b.classList.toggle('on', b.dataset.bt===breakType));
  const map = new Map();
  for (const x of txs) if (x.type===breakType) map.set(x.cat, (map.get(x.cat)||0) + x.amount);
  const total = [...map.values()].reduce((a,b)=>a+b,0);
  if (!total){ $('#breakdown').innerHTML = `<div class="empty">لا توجد ${breakType==='expense'?'مصاريف':'مداخيل'} في هذه الفترة</div>`; return; }
  const rows = [...map].sort((a,b)=>b[1]-a[1]);
  $('#breakdown').innerHTML = rows.map(([id,amt])=>{
    const c = catOf(breakType,id), pct = amt/total*100;
    return `<div class="cat-row ${catFilter && catFilter.type===breakType && catFilter.id===id ? 'sel':''}" data-cat="${esc(id)}">
      <div class="cat-ico" style="background:${c.color}22">${esc(c.icon)}</div>
      <div><div class="cat-name"><span>${esc(c.name)}</span><small>${pct<1?'<1':Math.round(pct)}%</small></div>
        <div class="bar"><i style="width:${pct}%;background:${c.color}"></i></div></div>
      <div class="cat-amt">${money(amt)}</div></div>`;
  }).join('');
}

function renderList(txs){
  let list = txs;
  if (catFilter) list = list.filter(x => x.type===catFilter.type && x.cat===catFilter.id);
  list = [...list].sort((a,b)=> b.date.localeCompare(a.date) || b.created - a.created);
  $('#tx-count').textContent = list.length ? `${list.length} عملية` : '';
  let html = '';
  if (catFilter){
    const c = catOf(catFilter.type, catFilter.id);
    html += `<div class="filter-note"><span>${esc(c.icon)} ${esc(c.name)} فقط — المجموع ${moneyC(sum(list, catFilter.type))}</span><button id="clear-filter">✕ الكل</button></div>`;
  }
  if (!list.length){
    html += `<div class="empty">${S.tx.length ? 'لا توجد عمليات في هذه الفترة' : 'ابدأ بإضافة أول مدخول أو مصروف من الأزرار في الأسفل 👇'}</div>`;
  } else {
    let cur = null, group = [];
    const flush = () => {
      if (!group.length) return;
      const d = parse(cur), o = sum(group,'expense'), i = sum(group,'income');
      html += `<div class="day-h"><span>${fmtDay(d)}</span><span>${i?`+${money(i)} `:''}${o?`−${money(o)}`:''}</span></div>` +
        group.map(x=>{
          const c = catOf(x.type,x.cat), inc = x.type==='income';
          return `<div class="tx" data-id="${x.id}">
            <div class="cat-ico" style="background:${c.color}22">${esc(c.icon)}</div>
            <div style="min-width:0"><div class="t1">${esc(c.name)}</div>${x.note?`<div class="t2">${esc(x.note)}</div>`:''}</div>
            <div class="amt ${inc?'i':'o'}">${inc?'+':'−'}${money(x.amount)}</div></div>`;
        }).join('');
      group = [];
    };
    for (const x of list){ if (x.date !== cur){ flush(); cur = x.date; } group.push(x); }
    flush();
  }
  $('#list').innerHTML = html;
}

/* ---------- transaction dialog ---------- */
const dlgTx = $('#dlg-tx');
let edit = { id:null, type:'expense', cat:null };
function openTx(type, tx){
  edit = tx ? { id:tx.id, type:tx.type, cat:tx.cat } : { id:null, type, cat:null };
  $('#tx-title').textContent = tx ? 'تعديل العملية' : (type==='income' ? 'مدخول جديد' : 'مصروف جديد');
  $('#f-amount').value = tx ? String(tx.amount) : '';
  const today = ymd(new Date()), [f,t] = range();
  $('#f-date').value = tx ? tx.date : (today >= ymd(f) && today <= ymd(t) ? today : (P.mode==='day' ? ymd(f) : today));
  $('#f-note').value = tx ? tx.note || '' : '';
  $('#f-del').hidden = !tx;
  $('#f-err').hidden = true;
  document.querySelectorAll('.cur').forEach(e=>e.textContent = S.currency);
  paintTxForm();
  dlgTx.showModal();
  if (!tx) setTimeout(()=>$('#f-amount').focus(), 50);
}
function paintTxForm(){
  document.querySelectorAll('.type-seg button').forEach(b=>b.classList.toggle('on', b.dataset.t===edit.type));
  if (!S.cats[edit.type].some(c=>c.id===edit.cat)) edit.cat = edit.id ? edit.cat : null;
  $('#f-cats').innerHTML = S.cats[edit.type].map(c=>
    `<button type="button" class="chip ${c.id===edit.cat?'on':''}" data-c="${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</button>`).join('');
}
document.querySelectorAll('.type-seg button').forEach(b=>b.onclick=()=>{
  if (edit.type !== b.dataset.t){ edit.type = b.dataset.t; edit.cat = null; }
  $('#tx-title').textContent = edit.id ? 'تعديل العملية' : (edit.type==='income' ? 'مدخول جديد' : 'مصروف جديد');
  paintTxForm();
});
$('#f-cats').onclick = e => { const c = e.target.closest('.chip'); if (c){ edit.cat = c.dataset.c; paintTxForm(); } };
$('#f-cancel').onclick = () => dlgTx.close();
$('#form-tx').onsubmit = e => {
  e.preventDefault();
  const amount = parseAmount($('#f-amount').value), date = $('#f-date').value, err = $('#f-err');
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!(amount > 0)) return fail('اكتب مبلغًا صحيحًا (مثلاً 12.500)');
  if (!edit.cat) return fail('اختر النوع');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return fail('اختر التاريخ');
  const data = { type:edit.type, amount, cat:edit.cat, date, note:$('#f-note').value.trim() };
  if (edit.id){ Object.assign(S.tx.find(x=>x.id===edit.id), data); toast('تمّ التعديل'); }
  else { S.tx.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), created: Date.now(), ...data }); toast('تمّت الإضافة ✓'); }
  save(); dlgTx.close(); render();
};
$('#f-del').onclick = () => {
  if (!confirm('حذف هذه العملية؟')) return;
  S.tx = S.tx.filter(x=>x.id!==edit.id); save(); dlgTx.close(); render(); toast('تمّ الحذف');
};

/* ---------- settings ---------- */
const dlgSet = $('#dlg-set');
function paintSettings(){
  $('#s-cur').value = S.currency;
  for (const type of ['expense','income']){
    $(`#s-cats-${type}`).innerHTML = S.cats[type].map(c=>{
      const n = S.tx.filter(x=>x.type===type && x.cat===c.id).length;
      return `<div class="cat-edit"><span>${esc(c.icon)} ${esc(c.name)} <small class="note">${n?`(${n})`:''}</small></span>
        <button data-ren="${type}:${esc(c.id)}" title="تغيير الاسم">✏️</button>
        ${S.cats[type].length>1?`<button data-delcat="${type}:${esc(c.id)}" title="حذف">🗑️</button>`:''}</div>`;
    }).join('');
  }
}
$('#btn-settings').onclick = () => { paintSettings(); dlgSet.showModal(); };
$('#s-close').onclick = () => dlgSet.close();
$('#s-cur').onchange = e => { S.currency = e.target.value.trim() || DEFAULT.currency; save(); render(); };
dlgSet.addEventListener('click', e => {
  const add = e.target.closest('[data-addcat]'), del = e.target.closest('[data-delcat]'), ren = e.target.closest('[data-ren]');
  if (add){
    const type = add.dataset.addcat, name = $(`#s-name-${type}`).value.trim();
    if (!name) return;
    const list = S.cats[type];
    list.push({ id: 'c'+Date.now().toString(36), name, icon: $(`#s-ico-${type}`).value.trim() || '🏷️', color: COLORS[list.length % COLORS.length] });
    $(`#s-name-${type}`).value = $(`#s-ico-${type}`).value = '';
    save(); paintSettings(); render();
  }
  if (ren){
    const [type,id] = ren.dataset.ren.split(':'), c = S.cats[type].find(c=>c.id===id);
    const name = prompt('الاسم الجديد', c.name);
    if (name && name.trim()){ c.name = name.trim(); save(); paintSettings(); render(); }
  }
  if (del){
    const [type,id] = del.dataset.delcat.split(':');
    const rest = S.cats[type].filter(c=>c.id!==id), used = S.tx.filter(x=>x.type===type && x.cat===id);
    const target = rest.find(c=>c.name==='أخرى') || rest[rest.length-1];
    const msg = used.length ? `في هذا النوع ${used.length} عملية، ستُنقل إلى «${target.name}». نواصل؟` : 'حذف هذا النوع؟';
    if (!confirm(msg)) return;
    used.forEach(x=>x.cat = target.id);
    S.cats[type] = rest;
    if (catFilter && catFilter.id===id) catFilter = null;
    save(); paintSettings(); render();
  }
});
function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
$('#s-export').onclick = () => download(`flousi-${ymd(new Date())}.json`, JSON.stringify(S,null,1), 'application/json');
$('#s-csv').onclick = () => {
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const rows = [['التاريخ','الصنف','النوع','المبلغ','ملاحظة'].map(q).join(';')];
  [...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x =>
    rows.push([x.date, x.type==='income'?'مدخول':'مصروف', catOf(x.type,x.cat).name, String(x.amount).replace('.',','), x.note||''].map(q).join(';')));
  download(`flousi-${ymd(new Date())}.csv`, '﻿' + rows.join('\r\n'), 'text/csv');
};
$('#s-import').onclick = () => $('#s-file').click();
$('#s-file').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try{
    const d = JSON.parse(await file.text());
    if (!d || !Array.isArray(d.tx) || !d.cats || !Array.isArray(d.cats.expense) || !Array.isArray(d.cats.income)) throw 0;
    if (!confirm(`استرجاع ${d.tx.length} عملية؟ المعطيات الحالية ستُعوَّض.`)) return;
    S = { currency: d.currency || DEFAULT.currency, cats: d.cats,
      tx: d.tx.filter(x => x && (x.type==='income'||x.type==='expense') && x.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(x.date)) };
    save(); paintSettings(); render(); toast('تمّ الاسترجاع');
  }catch(err){ alert('الملف غير صالح'); }
};
$('#s-wipe').onclick = () => {
  if (!confirm('مسح كل العمليات والأنواع؟ لا يمكن التراجع.')) return;
  S = freshState(); catFilter = null; save(); paintSettings(); render();
};

/* ---------- events ---------- */
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  P.mode = b.dataset.m;
  if (P.mode === 'custom' && !P.from){ const [f,t] = range('month'); P.from = ymd(f); P.to = ymd(t); }
  render();
});
$('#prev').onclick = () => shift(-1);
$('#next').onclick = () => shift(1);
$('#cfrom').onchange = e => { if (e.target.value){ P.from = e.target.value; render(); } };
$('#cto').onchange = e => { if (e.target.value){ P.to = e.target.value; render(); } };
document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{ breakType = b.dataset.bt; render(); });
$('#breakdown').onclick = e => {
  const r = e.target.closest('.cat-row'); if (!r) return;
  const id = r.dataset.cat;
  catFilter = catFilter && catFilter.id===id && catFilter.type===breakType ? null : { type:breakType, id };
  render();
};
$('#list').onclick = e => {
  if (e.target.id === 'clear-filter'){ catFilter = null; render(); return; }
  const r = e.target.closest('.tx'); if (r) openTx(null, S.tx.find(x=>x.id===r.dataset.id));
};
$('#add-in').onclick = () => openTx('income');
$('#add-out').onclick = () => openTx('expense');
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]') || e.target.matches('input,textarea,select')) return;
  if (e.key === 'ArrowRight') shift(-1);
  if (e.key === 'ArrowLeft') shift(1);
});
addEventListener('storage', e => { if (e.key === KEY){ S = load(); render(); } });

render();
</script>
</body>
