<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>رسوخ</title>
  <meta name="theme-color" content="#4a0b93">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&family=Oswald:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/home"><img src="logo.svg" alt=""><span>رسوخ</span></a>
    <nav id="nav"></nav>
    <div class="who"><span id="who-name"></span>
      <a href="#/challenges" id="cup" class="bell cup" title="التحديات" aria-label="التحديات" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></a>
      <a href="#/notifications" id="bell" class="bell" title="الإشعارات" aria-label="الإشعارات" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b hidden></b></a>
      <span id="who-photo"></span><button class="btn ghost small" id="logout">خروج</button></div>
  </header>
  <main id="view" class="container"></main>
  <nav id="tabbar" class="tabbar" hidden></nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <p class="error" id="modal-error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn" value="ok">حفظ</button>
        <button type="button" class="btn ghost" id="modal-cancel">إلغاء</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script src="quran-data.js"></script>
  <script src="quran.js"></script>
  <script src="google.js"></script>
  <script src="benefits.js"></script>
  <script src="teacher.js"></script>
  <script src="quiz.js"></script>
  <script>router();</script>
</body>
</html>
