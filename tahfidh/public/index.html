<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>حلقة التحفيظ</title>
  <meta name="theme-color" content="#4a0b93">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&family=Oswald:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/home"><img src="logo.svg" alt=""><span>حلقة التحفيظ</span></a>
    <nav id="nav"></nav>
    <div class="who"><span id="who-name"></span><span id="who-photo"></span><button class="btn ghost small" id="logout">خروج</button></div>
  </header>
  <main id="view" class="container"></main>
  <nav id="tabbar" class="tabbar" hidden></nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <p class="error" id="modal-error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn" value="ok">حفظ</button>
        <button type="button" class="btn ghost" id="modal-cancel">إلغاء</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script src="quran-data.js"></script>
  <script src="quran.js"></script>
  <script src="google.js"></script>
  <script>router();</script>
</body>
</html>
