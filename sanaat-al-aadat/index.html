<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صناعة العادات</title>
  <meta name="theme-color" content="#61038d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>صناعة العادات</h1>
      <div class="row" style="flex-wrap:nowrap;min-width:0">
        <span class="who" id="who"></span>
        <button class="btn ghost small" id="logout" hidden>خروج</button>
      </div>
    </div>
    <div class="wrap tabs" role="tablist" id="tabs" hidden>
      <button type="button" role="tab" data-tab="habits" aria-selected="true">عاداتي</button>
      <button type="button" role="tab" data-tab="board" aria-selected="false">🏆 الترتيب</button>
      <button type="button" role="tab" data-tab="rules" aria-selected="false">📜 القانون</button>
      <button type="button" role="tab" data-tab="admin" aria-selected="false" hidden id="tab-admin">الإدارة</button>
    </div>
  </header>
  <main class="wrap" id="view"><p class="muted">جاري التحميل…</p></main>
  <div class="toast" id="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
