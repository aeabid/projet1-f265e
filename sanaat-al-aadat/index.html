<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>صناعة العادات</title>
  <meta name="theme-color" content="#4a0b93">
  <link rel="icon" href="feed-icon.png">
  <link rel="apple-touch-icon" href="feed-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <img src="feed-logo-white.png" alt="feed" width="56" height="32">
        <h1>صناعة العادات</h1>
      </div>
      <div class="top-actions" id="top-actions" hidden>
        <button class="icon-btn" type="button" id="rules-btn" aria-label="القانون" title="القانون">📜</button>
        <button class="icon-btn" type="button" id="sound-btn" aria-label="الصوت" title="الصوت">🔊</button>
        <button class="icon-btn" type="button" id="logout" aria-label="خروج" title="خروج">⏻</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"><div class="loading"><span class="spinner"></span></div></main>
  <nav class="bottom-nav" id="nav" hidden>
    <button type="button" data-tab="today"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>اليوم</span></button>
    <button type="button" data-tab="quests"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span>التحديات</span><b class="dot" id="quest-dot" hidden></b></button>
    <button type="button" data-tab="board"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg><span>الترتيب</span></button>
    <button type="button" data-tab="me"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="m9 13.5-2 7 5-2.5 5 2.5-2-7"/></svg><span>إنجازاتي</span></button>
    <button type="button" data-tab="admin" id="tab-admin" hidden><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>الإدارة</span><b class="dot" id="admin-dot" hidden></b></button>
  </nav>
  <div class="toast" id="toast" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
